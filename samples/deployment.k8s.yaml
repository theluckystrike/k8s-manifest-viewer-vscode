apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-api
  namespace: production
  labels:
    app: checkout-api
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: checkout-api
  template:
    metadata:
      labels:
        app: checkout-api
        tier: backend
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: api
          image: ghcr.io/acme/checkout-api:1.14.2
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
        - name: debug-sidecar
          image: busybox:latest
          securityContext:
            privileged: true
---
apiVersion: v1
kind: Service
metadata:
  name: checkout-api-svc
  namespace: production
spec:
  selector:
    app: checkout-api
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: checkout-ingress
  namespace: production
spec:
  rules:
    - host: checkout.example.com
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: checkout-config
  namespace: production
data:
  LOG_LEVEL: info
  TIMEOUT_MS: "3000"
